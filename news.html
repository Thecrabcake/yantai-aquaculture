<script>
const NEWS = [{"date": "2026-09-09", "category": "天气", "title": "山东沿海风暴潮蓝色警报（烟台威海乳山）", "summary": "冷空气影响，辽宁到山东沿海30-70厘米风暴增水，威海沿岸达蓝色警戒潮位；要求加固养殖设施、巡查海堤涵闸、防海水倒灌。", "url": "https://www.weihai.gov.cn/art/2026/9/9/art_59518_6598525.html", "source": "威海市政府"}, {"date": "2026-09-06", "category": "天气", "title": "山东海上大风警报：黄海阵风8级", "summary": "省气象台发布海上大风警报：7-9日渤海黄海北风6-7级阵风8级，2.8-3.8米大浪，提示对海上生产作业和沿海养殖有不利影响。", "url": "http://yjt.shandong.gov.cn/yjyb/202609/t20260906_4990299.html", "source": "山东省应急厅"}, {"date": "2026-09-04", "category": "政策", "title": "黄渤海休渔结束 山东开海", "summary": "9月1日12时伏季休渔结束，烟台2800艘渔船出海；开渔后启动护渔护航执法，重点查渔船身份、禁用渔具等七环节。", "url": "http://fgw.shandong.gov.cn/art/2026/9/4/art_104926_10505065.html", "source": "山东省发改委"}, {"date": "2026-09-03", "category": "进口", "title": "中厄渔业合作解读：厄虾占中国进口虾市场70%以上", "summary": "2026年厄瓜多尔白虾关税降至3.5%（2034年前逐步归零）；2025-2026厄虾对华出口增长趋缓，虾价下行，贸易进入新稳态。", "url": "https://chinatradenews.com.cn/epaper/content/2026-09/03/content_97424.htm", "source": "中国贸易报"}, {"date": "2026-09-02", "category": "病害", "title": "曹妃甸水产旺季专家指导虾病防控", "summary": "中秋国庆双节产销旺季，专家针对南美白对虾白斑综合征、桃拉综合征、虾肝肠胞虫病开展综合防控指导，帮助提升成活率。", "url": "https://www.163.com/dy/article/L5TV2IN60514OQ0Q.html", "source": "网易"}, {"date": "2026-09-01", "category": "病害", "title": "全国9月水产养殖病害预测：重点关注白斑综合征等", "summary": "农业农村部水产养殖病害防治专家委员会预测9月重点关注白斑综合征、十足目虹彩病毒病、急性肝胰腺坏死病、虾肝肠胞虫病。", "url": "http://www.nftec.agri.cn/tzgg/202609/t20260901_8868377.htm", "source": "全国水产技术推广总站"}, {"date": "2026-09-01", "category": "政策", "title": "烟台日报：碧海静养四月整 千帆竞发开渔时", "summary": "烟台本地开海报道：休渔四个月结束，全市渔船竞发，本地海鲜供应量上升。", "url": "https://www.shm.com.cn/szb/ytrb/paper/pc/attachment/202609/01/373e2ed0-7b19-4eab-a0f0-f3f14b85ec3a.pdf", "source": "烟台日报"}, {"date": "2026-08-31", "category": "天气", "title": "青岛9月灾害风险会商：黄海中部2次大浪过程", "summary": "9月青岛主要受冷空气和温带气旋影响，黄海中部将发生2次左右大浪过程，沿岸0-1次台风风暴潮，需强化海洋灾害监测预警。", "url": "http://ajj.qingdao.gov.cn/zxgz/fzjz/gzdt_42/202608/t20260831_10717966.shtml", "source": "青岛市应急局"}, {"date": "2026-05-03", "category": "进口", "title": "厄瓜多尔白虾接连被退运：疫病与防腐剂超标", "summary": "4月32批次485吨厄虾因动物疫病被退运；5月12家厄工厂约100条集装箱因焦亚硫酸钠超标在天津港退运。检疫摩擦是厄虾对华出口主要风险。", "url": "https://www.news.cn/world/20260503/36533a0ec44d4c03b0227a986193550f/c.html", "source": "新华社"}];
const COLORS = { "病害": "#dc2626", "进口": "#2563eb",
                 "政策": "#16a34a", "天气": "#ea580c" };
const list = document.getElementById("list");
NEWS.forEach(n => {
  const el = document.createElement("div");
  el.className = "item";
  const color = COLORS[n.category] || "#666";
  const title = n.url
    ? `<a class="title" href="${n.url}" target="_blank">${n.title}</a>`
    : `<span class="title">${n.title}</span>`;
  el.innerHTML = `<span class="tag" style="background:${color}">${n.category}</span>
    ${title}
    <div class="summary">${n.summary || ""}</div>
    <div class="meta">${n.date} · ${n.source}</div>`;
  list.appendChild(el);
});
</script>
